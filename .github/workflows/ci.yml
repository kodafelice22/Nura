name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: medusa

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: medusa/package-lock.json

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Lint deployment scripts
        run: shellcheck scripts/*.sh

      - name: Test audit gate
        run: node --test scripts/audit-gate.test.mjs

      - name: Audit high-risk production dependencies
        run: npm run security:audit

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build backend
        run: npm run build --workspace=@dtc/backend

      - name: Build storefront
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.example.invalid
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_00000000000000000000000000000000
          NEXT_PUBLIC_BASE_URL: https://store.example.invalid
          NEXT_PUBLIC_DEFAULT_REGION: ci
        run: npm run build --workspace=@dtc/storefront
