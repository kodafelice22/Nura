services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: medusa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
    restart: unless-stopped
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${GEOIPUPDATE_ACCOUNT_ID:?create a free MaxMind account and license key — see DEPLOYMENT.md}
      GEOIPUPDATE_LICENSE_KEY: ${GEOIPUPDATE_LICENSE_KEY:?create a free MaxMind account and license key — see DEPLOYMENT.md}
      GEOIPUPDATE_EDITION_IDS: "GeoLite2-Country"
      # Re-download every 72h so the database stays current — MaxMind
      # updates GeoLite2 roughly weekly.
      GEOIPUPDATE_FREQUENCY: "72"
    volumes:
      - geoip_data:/usr/share/GeoIP
    networks:
      - maintenance
    healthcheck:
      test: ["CMD-SHELL", "test -s /usr/share/GeoIP/GeoLite2-Country.mmdb"]
      interval: 10s
      timeout: 5s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.11@sha256:6f8f1fc29d1ff67b4d8d503bb4e0a69b55c8d42600decafde951344218193a27
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: "${MEILISEARCH_API_KEY:?set MEILISEARCH_API_KEY in .env, generate with: openssl rand -hex 16}"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - data
      - edge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: nura/backend:current
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      MEDUSA_BOOTSTRAP_MODE: ${MEDUSA_BOOTSTRAP_MODE:-false}
      DATABASE_URL: postgres://medusa:${POSTGRES_PASSWORD}@postgres:5432/medusa
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in .env}
      ORDER_ACCESS_SECRET: ${ORDER_ACCESS_SECRET:?set ORDER_ACCESS_SECRET in .env}
      STORE_CORS: ${STORE_CORS:?set STORE_CORS in .env, e.g. https://nura-paris.com}
      ADMIN_CORS: ${ADMIN_CORS:?set ADMIN_CORS in .env, e.g. https://admin.nura-paris.com}
      AUTH_CORS: ${AUTH_CORS:?set AUTH_CORS in .env, combine STORE_CORS and ADMIN_CORS}
      STOREFRONT_URL: ${NEXT_PUBLIC_BASE_URL:?set to your public storefront URL, e.g. https://nura-paris.com}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET in .env}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      JEKO_API_KEY: ${JEKO_API_KEY:-}
      JEKO_API_KEY_ID: ${JEKO_API_KEY_ID:-}
      JEKO_STORE_ID: ${JEKO_STORE_ID:-}
      JEKO_WEBHOOK_SECRET: ${JEKO_WEBHOOK_SECRET:-}
      JEKO_API_URL: ${JEKO_API_URL:-}
      JEKO_AMOUNT_MULTIPLIER: ${JEKO_AMOUNT_MULTIPLIER:-}
      MEDUSA_FF_RBAC: ${MEDUSA_FF_RBAC:-false}
      MEDUSA_FF_RBAC_FILTER_FIELDS: ${MEDUSA_FF_RBAC_FILTER_FIELDS:-false}
      MEDUSA_LICENSE_KEY: ${MEDUSA_LICENSE_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:?set a production Resend API key}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?set an address on a Resend-verified domain}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-fr}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
      S3_FILE_URL: ${S3_FILE_URL:?set the public URL of persistent media storage}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set the S3-compatible access key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set the S3-compatible secret key}
      S3_REGION: ${S3_REGION:?set the S3-compatible region}
      S3_BUCKET: ${S3_BUCKET:?set the S3-compatible bucket}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: nura-backend
      REFERRAL_REWARD_EUR: ${REFERRAL_REWARD_EUR:?set the EUR referral reward}
      REFERRAL_REWARD_XOF: ${REFERRAL_REWARD_XOF:?set the XOF referral reward}
      ALLOW_PLACEHOLDER_PRODUCT_IMAGES: ${ALLOW_PLACEHOLDER_PRODUCT_IMAGES:-false}
    expose:
      - "9000"
    networks:
      - data
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  storefront:
    image: nura/storefront:current
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:?set to your public backend URL, e.g. https://api.nura-paris.com}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY-}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?set to your public storefront URL, e.g. https://nura-paris.com}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-ci}
        NEXT_PUBLIC_STRIPE_KEY: ${NEXT_PUBLIC_STRIPE_KEY:-}
        NEXT_PUBLIC_MEILISEARCH_HOST: ${NEXT_PUBLIC_MEILISEARCH_HOST:-}
        NEXT_PUBLIC_MEILISEARCH_API_KEY: ${NEXT_PUBLIC_MEILISEARCH_API_KEY:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_TIKTOK_PIXEL_ID: ${NEXT_PUBLIC_TIKTOK_PIXEL_ID:-}
        NEXT_PUBLIC_WHATSAPP_ORDER_UPDATES_ENABLED: ${NEXT_PUBLIC_WHATSAPP_ORDER_UPDATES_ENABLED:-false}
        LEGAL_LAST_UPDATED: ${LEGAL_LAST_UPDATED-}
        LEGAL_BUSINESS_NAME: ${LEGAL_BUSINESS_NAME-}
        LEGAL_FORM: ${LEGAL_FORM-}
        LEGAL_CAPITAL: ${LEGAL_CAPITAL-}
        LEGAL_REGISTRY_CITY: ${LEGAL_REGISTRY_CITY-}
        LEGAL_REGISTRATION_NUMBER: ${LEGAL_REGISTRATION_NUMBER-}
        LEGAL_VAT_NUMBER: ${LEGAL_VAT_NUMBER-}
        LEGAL_ADDRESS: ${LEGAL_ADDRESS-}
        LEGAL_PUBLICATION_DIRECTOR: ${LEGAL_PUBLICATION_DIRECTOR-}
        LEGAL_HOST_NAME: ${LEGAL_HOST_NAME-}
        LEGAL_HOST_ADDRESS: ${LEGAL_HOST_ADDRESS-}
        LEGAL_HOST_PHONE: ${LEGAL_HOST_PHONE-}
        LEGAL_MEDIATOR_NAME: ${LEGAL_MEDIATOR_NAME-}
        LEGAL_MEDIATOR_URL: ${LEGAL_MEDIATOR_URL-}
    restart: unless-stopped
    environment:
      ORDER_ACCESS_SECRET: ${ORDER_ACCESS_SECRET:?set ORDER_ACCESS_SECRET in .env}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET in .env}
      LEGAL_LAST_UPDATED: ${LEGAL_LAST_UPDATED-}
      LEGAL_BUSINESS_NAME: ${LEGAL_BUSINESS_NAME-}
      LEGAL_FORM: ${LEGAL_FORM-}
      LEGAL_CAPITAL: ${LEGAL_CAPITAL-}
      LEGAL_REGISTRY_CITY: ${LEGAL_REGISTRY_CITY-}
      LEGAL_REGISTRATION_NUMBER: ${LEGAL_REGISTRATION_NUMBER-}
      LEGAL_VAT_NUMBER: ${LEGAL_VAT_NUMBER-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS-}
      LEGAL_PUBLICATION_DIRECTOR: ${LEGAL_PUBLICATION_DIRECTOR-}
      LEGAL_HOST_NAME: ${LEGAL_HOST_NAME-}
      LEGAL_HOST_ADDRESS: ${LEGAL_HOST_ADDRESS-}
      LEGAL_HOST_PHONE: ${LEGAL_HOST_PHONE-}
      LEGAL_MEDIATOR_NAME: ${LEGAL_MEDIATOR_NAME-}
      LEGAL_MEDIATOR_URL: ${LEGAL_MEDIATOR_URL-}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: nura/caddy:current
    build:
      context: .
      dockerfile: Dockerfile.caddy
    command: ["caddy", "run", "--config", "${CADDY_CONFIG_FILE:-/etc/caddy/Caddyfile}", "--adapter", "caddyfile"]
    restart: unless-stopped
    environment:
      STOREFRONT_DOMAIN: ${STOREFRONT_DOMAIN:?set the storefront hostname}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?set the backend hostname}
      PREVIEW_ALLOWED_CIDRS: ${PREVIEW_ALLOWED_CIDRS:-}
    depends_on:
      backend:
        condition: service_healthy
      geoipupdate:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.bootstrap:/etc/caddy/Caddyfile.bootstrap:ro
      - ./Caddyfile.common:/etc/caddy/Caddyfile.common:ro
      - ./Caddyfile.preview:/etc/caddy/Caddyfile.preview:ro
      - geoip_data:/etc/caddy/geoip:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  redis_data:
  geoip_data:
  meilisearch_data:
  caddy_data:
  caddy_config:

networks:
  data:
    internal: true
  edge:
  maintenance:
